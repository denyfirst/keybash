<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>Keybash · Terminal</title>
  <link rel="preload" href="/schibsted-grotesk.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/keybash.css">
  <link rel="stylesheet" href="/style.css">
  <script src="/vendor/xterm.js" defer></script>
  <script type="module" src="/app.mjs"></script>
</head>
<body class="session-page">
  <main>
    <section id="login-panel" class="panel login-panel">
      <form id="login"><label for="code">One-time lab sign-in code</label><div class="login-row"><input id="code" type="password" autocomplete="off" maxlength="64" required><button type="submit">Open session</button></div></form>
    </section>
    <section class="session" aria-label="Terminal workspace">
      <div class="toolbar"><div class="toolbar-start"><span class="wordmark session-mark">keybash<span class="wordmark-stop">.</span></span><div class="tab"><span class="tab-dot"></span><span id="tab-name">ssh</span> <span class="tab-type">SSH</span></div><a id="new-session" class="new-session" target="_blank" rel="noopener" title="New session to this server" aria-label="New session to this server" hidden><svg class="button-glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg></a></div><div class="tools"><button id="copy" disabled>Copy</button><button id="paste" disabled>Paste</button><button id="fullscreen" disabled>Full screen</button><button id="disconnect" disabled>Disconnect</button></div></div>
      <div id="terminal" aria-label="SSH terminal"></div>
      <footer class="session-foot"><span id="status" role="status">Not connected</span><span class="session-keys">Ctrl+C: interrupt <i>·</i> Ctrl+Shift+C: copy</span><span class="session-end"><span id="size">100 × 30</span><i>·</i><span>by <span class="org"><span class="org-deny">deny</span>first<span class="wordmark-stop">.</span></span></span></span></footer>
    </section>
    <p id="notice" role="status" class="notice"></p>
  </main>
  <dialog id="paste-review"><form method="dialog"><p class="eyebrow">Paste review</p><h2>Check the text before it is sent.</h2><p class="hint">It may contain commands and control characters.</p><textarea id="paste-preview" readonly aria-label="Paste preview"></textarea><div class="dialog-actions"><button value="cancel" id="cancel-paste" class="secondary">Cancel</button><button type="button" id="confirm-paste" class="primary">Send to terminal</button></div></form></dialog>
  <dialog id="clipboard-panel"><form method="dialog"><h2>Clipboard</h2><p id="clipboard-help" class="hint"></p><textarea id="clipboard-text" aria-label="Clipboard text" maxlength="32768"></textarea><div class="dialog-actions"><button value="close" class="secondary">Close</button><button type="button" id="panel-paste">Review paste</button></div></form></dialog>
</body>
</html>
