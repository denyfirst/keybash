<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>Keybash · Terminal</title>
  <link rel="preload" href="/schibsted-grotesk.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/keybash.css">
  <link rel="stylesheet" href="/style.css">
  <script src="/vendor/xterm.js" defer></script>
  <script src="/vendor/xterm-addon-webgl.js" defer></script>
  <script type="module" src="/app.mjs"></script>
</head>
<body class="session-page">
  <main>
    <section id="login-panel" class="panel login-panel">
      <form id="login"><label for="code">One-time lab sign-in code</label><div class="login-row"><input id="code" type="password" autocomplete="off" maxlength="64" required><button type="submit">Open session</button></div></form>
    </section>
    <section class="session" aria-label="Terminal workspace">
      <header class="bar">
        <div class="bar-start"><span class="wordmark session-mark">keybash<span class="wordmark-stop">.</span></span><span id="status" role="status">Not connected</span><span id="tab-name" class="session-name">ssh</span><span class="session-kind">SSH</span></div>
        <div class="tools">
          <span id="size" class="size" title="Columns × rows">100 × 30</span>
          <button id="copy" disabled title="Copy the selection · Ctrl+Shift+C"><svg class="button-glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg><span class="label">Copy</span></button>
          <button id="paste" disabled title="Paste · Ctrl+V; several lines are shown first"><svg class="button-glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/></svg><span class="label">Paste</span></button>
          <button id="fullscreen" disabled title="Full screen"><svg class="button-glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="label">Full screen</span></button>
          <button id="disconnect" class="end" disabled title="Disconnect"><svg class="button-glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v8M6.4 6.6a8 8 0 1 0 11.2 0"/></svg><span class="label">Disconnect</span></button>
        </div>
      </header>
      <div class="work">
        <button class="bar-handle" type="button" aria-label="Show the session bar"></button>
        <div id="terminal" aria-label="SSH terminal"></div>
        <div class="ended-card"><p id="notice" role="status" class="notice"></p><button id="reconnect" type="button" hidden>Connect again</button></div>
      </div>
    </section>
  </main>
  <dialog id="paste-review"><form method="dialog"><p class="eyebrow">Paste review</p><h2>Check the text before it is sent.</h2><p class="hint">It may contain commands and control characters.</p><textarea id="paste-preview" readonly aria-label="Paste preview"></textarea><div class="dialog-actions"><button value="cancel" id="cancel-paste" class="secondary">Cancel</button><button type="button" id="confirm-paste" class="primary">Send to terminal</button></div></form></dialog>
  <dialog id="clipboard-panel"><form method="dialog"><h2>Clipboard</h2><p id="clipboard-help" class="hint"></p><textarea id="clipboard-text" aria-label="Clipboard text" maxlength="32768"></textarea><div class="dialog-actions"><button value="close" class="secondary">Close</button><button type="button" id="panel-paste">Review paste</button></div></form></dialog>
</body>
</html>
