<!doctype html>
<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Keybash · Giriş</title><link rel="stylesheet" href="/auth.css"><script type="module" src="/custody.mjs"></script></head>
<body data-screen="login"><main>
<a class="brand" href="/login" aria-label="Keybash"><span class="mark">k</span>keybash<span class="dot">.</span></a>
<section class="card"><div class="heading-row"><p class="eyebrow">SƏNİN İŞ YERİN</p><span class="tag">Self-host</span></div><h1>Xoş gəldin.</h1>
<form id="signin" method="post" action="/api/session" hidden><label for="username">İstifadəçi adı</label><input id="username" name="username" autocomplete="username" maxlength="64" autocapitalize="none" spellcheck="false" required><label for="password">Şifrə</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required><button type="submit">Daxil ol</button></form>
<form id="bootstrap" method="post" action="/api/bootstrap" hidden><p class="hint">İlk hesabını yarat. Birdəfəlik kodu serveri quran şəxsdən al.</p><label for="setup-code">Birdəfəlik kod</label><input id="setup-code" name="code" type="password" autocomplete="off" maxlength="43" required><label for="setup-user">İstifadəçi adı</label><input id="setup-user" name="username" autocomplete="username" pattern="[a-z0-9._-]{1,64}" maxlength="64" autocapitalize="none" required><label for="setup-password">Şifrə</label><input id="setup-password" name="password" type="password" autocomplete="new-password" maxlength="1024" required><p class="hint">Ən azı 15 simvol; uzun, unikal şifrə seç.</p><button type="submit">Hesab yarat</button></form>
<p id="notice" role="status" aria-live="polite"></p></section><p class="foot">Denyfirst · Öz serverində, öz nəzarətində.</p></main></body></html>
