<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keybash · Hesab</title>
  <link rel="stylesheet" href="/auth.css">
  <script type="module" src="/auth.mjs"></script>
</head>
<body data-screen="account">
  <main>
    <a class="brand" href="/" aria-label="Keybash"><span class="mark">k</span>keybash<span class="dot">.</span></a>
    <section class="card" aria-labelledby="heading">
      <div class="heading-row"><p class="eyebrow">HESAB</p><span class="tag">Self-host</span></div>
      <h1 id="heading">Giriş təsdiqləndi.</h1>
      <p id="account" class="hint"></p>
      <p class="lab-note">Bu, giriş sınağıdır. Server bağlantıları hələ bu ekrandan açılmır.</p>
      <form id="change" method="post" action="/api/password">
        <label for="current">Hazırkı şifrə</label>
        <input id="current" name="password" type="password" autocomplete="current-password" maxlength="1024" required>
        <label for="replacement">Yeni şifrə</label>
        <input id="replacement" name="next" type="password" autocomplete="new-password" maxlength="1024" required aria-describedby="password-help">
        <p id="password-help" class="hint">Ən azı 15 simvol. Uzun, unikal şifrə seç.</p>
        <label for="confirm">Yeni şifrəni təkrar et</label>
        <input id="confirm" type="password" autocomplete="new-password" maxlength="1024" required>
        <button type="submit">Şifrəni dəyiş</button>
      </form>
      <button id="logout" type="button" class="secondary">Hesabdan çıx</button>
      <p id="notice" role="status" aria-live="polite"></p>
    </section>
    <p class="foot">Şifrə dəyişəndə bu hesabın bütün giriş sessiyaları bağlanır.</p>
  </main>
</body>
</html>
