name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Private-repository checkout: the short-lived job token is supplied only to
# fetch, not persisted in git configuration. There are no third-party actions.
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out the exact event commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch -q --depth 1 origin "${GITHUB_SHA}"
          unset auth
          git checkout -q FETCH_HEAD

      - name: Verify local browser assets and test dependencies
        run: |
          set -eu
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.3 \
            https://nodejs.org/dist/v24.19.0/node-v24.19.0-linux-x64.tar.xz \
            --output "${RUNNER_TEMP}/keybash-node.tar.xz"
          printf '%s  %s\n' 14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647 \
            "${RUNNER_TEMP}/keybash-node.tar.xz" | sha256sum -c -
          tar -xf "${RUNNER_TEMP}/keybash-node.tar.xz" -C "${RUNNER_TEMP}"
          node_bin="${RUNNER_TEMP}/node-v24.19.0-linux-x64/bin"
          echo "${node_bin}" >> "${GITHUB_PATH}"
          export PATH="${node_bin}:${PATH}"
          test "$(node --version)" = v24.19.0
          npm install --prefix "${RUNNER_TEMP}/keybash-node-tools" pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
          pnpm="${RUNNER_TEMP}/keybash-node-tools/node_modules/.bin/pnpm"
          "${pnpm}" --dir web install --frozen-lockfile --ignore-scripts
          "${pnpm}" --dir web audit
          node web/vendor.mjs
          python3 scripts/vendor-guacamole.py --check
          test -z "$(git status --porcelain)"
          node --test web/paste.test.mjs
          "${pnpm}" --dir web exec playwright install --with-deps chromium

      - name: Verify the pinned toolchain and module files
        run: |
          set -eu
          expected="$(awk '$1 == "go" {print "go" $2}' go.mod)"
          test "$(go env GOVERSION)" = "${expected}"
          go mod tidy
          test -z "$(git status --porcelain)"
          go mod verify
          # The SSH module also contains unmaintained OpenPGP code. It is not
          # part of Keybash; prohibit importing it (including through tests).
          go list -deps -test ./... > "${RUNNER_TEMP}/keybash-dependencies"
          if grep -qE '^golang.org/x/crypto/openpgp($|/)' "${RUNNER_TEMP}/keybash-dependencies"; then
            echo 'unmaintained OpenPGP dependency is forbidden' >&2
            exit 1
          fi

      - name: Check formatting and invariant citations
        run: |
          set -eu
          test -z "$(gofmt -l internal web)"
          grep -ohE '`(Test|Fuzz)[A-Za-z0-9_]+' docs/SECURITY-INVARIANTS.md \
            | tr -d '`' | sort -u > "${RUNNER_TEMP}/cited"
          grep -rhoE '^func (Test|Fuzz)[A-Za-z0-9_]+' --include='*_test.go' internal \
            | sed -E 's/^func //' | sort -u > "${RUNNER_TEMP}/defined"
          test -z "$(comm -23 "${RUNNER_TEMP}/cited" "${RUNNER_TEMP}/defined")"

      - name: Build and verify the isolated native RDP laboratory
        run: sh scripts/native-rdp-lab.sh

      - name: Vet, race-test and build
        run: |
          set -eu
          go vet ./...
          go test -race -shuffle=on -count=1 -timeout=5m ./...
          # Count budgets avoid Go #75804's duration-cancellation race.
          # Every fuzz target must complete two million executions; no failure
          # is suppressed or retried. The hard timeout still detects hangs.
          go test ./internal/targetguard -run='^$' -fuzz='^FuzzCanonicalHostname$' -fuzztime=2000000x -timeout=3m
          go test ./internal/sshtransport -run='^$' -fuzz='^FuzzSSHHostKeyConfig$' -fuzztime=2000000x -timeout=3m
          go test ./internal/terminalweb -run='^$' -fuzz='^FuzzTerminalControl$' -fuzztime=2000000x -timeout=3m
          go test ./internal/rdplab -run='^$' -fuzz='^FuzzRDPConfirmation$' -fuzztime=2000000x -timeout=3m
          go test ./internal/rdplab -run='^$' -fuzz='^FuzzRDPWireAndClipboard$' -fuzztime=2000000x -timeout=3m
          go test -tags=browserlab -race -run='^TestBrowserTerminalLab$' -timeout=3m ./internal/sshtransport
          go test -tags=browserlab -race -run='^TestBrowserRDPViewerLab$' -timeout=1m ./internal/rdplab
          # Test-only empty netns; root setup drops to UID/GID 65534 with no
          # effective capabilities before the fixed child runs. No guacd yet.
          worker_dir="$(mktemp -d /tmp/keybash-rdp-worker.XXXXXX)"
          trap 'rm -f "${worker_dir}/lab.test"; rmdir "${worker_dir}"' EXIT
          chmod 755 "${worker_dir}"
          go test -c -tags=workerlab -race -o "${worker_dir}/lab.test" ./internal/rdplab
          go vet -tags=workerlab ./internal/rdplab
          chmod 755 "${worker_dir}/lab.test"
          "${worker_dir}/lab.test" -test.run='^TestRDPEmptyWorkerNamespaceDeniesEgress$' -test.timeout=15s -test.v
          go build -trimpath ./...
          for platform in linux darwin windows; do
            GOOS="${platform}" go vet ./...
            GOOS="${platform}" go build -trimpath ./...
          done

  analysis:
    name: Static and vulnerability analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the exact event commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch -q --depth 1 origin "${GITHUB_SHA}"
          unset auth
          git checkout -q FETCH_HEAD

      - name: Install pinned analysis tools outside the repository
        run: |
          set -eu
          export GOBIN="${RUNNER_TEMP}/keybash-tools"
          mkdir -p "${GOBIN}"
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Run static, security, vulnerability and workflow checks
        run: |
          set -eu
          tools="${RUNNER_TEMP}/keybash-tools"
          "${tools}/staticcheck" ./...
          "${tools}/gosec" -severity medium -confidence medium ./...
          "${tools}/govulncheck" ./...
          "${tools}/actionlint"

  commit-signatures:
    name: Commit signatures
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fetch PR history without executing its code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch -q --no-tags --filter=blob:none origin "${GITHUB_SHA}"
          unset auth
          git update-ref refs/merge FETCH_HEAD
          read -r -a parents <<< "$(git rev-list --parents -n 1 refs/merge)"
          test "${#parents[@]}" -eq 3
          git update-ref refs/base "${parents[1]}"
          git update-ref refs/head "${parents[2]}"
          # The next step authenticates any lazy fetch of the base signer blob.

      - name: Verify commits against the base signer list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          signers="${RUNNER_TEMP}/keybash-commit-signers"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            show refs/base:.github/commit-signers > "${signers}"
          unset auth
          test -s "${signers}"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "${signers}"
          checked=0
          for commit in $(git rev-list refs/base..refs/head); do
            checked=$((checked + 1))
            git verify-commit "${commit}"
          done
          test "${checked}" -gt 0
