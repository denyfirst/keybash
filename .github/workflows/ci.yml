name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Private-repository checkout: the short-lived job token is supplied only to
# fetch, not persisted in git configuration. There are no third-party actions.
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    # A normal run takes about 35 minutes; slow runners passed every test
    # yet crossed 45.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the exact event commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch -q --depth 1 origin "${GITHUB_SHA}"
          unset auth
          git checkout -q FETCH_HEAD

      - name: Verify source service units and actual aggregate kernel limits
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          sh scripts/service-lab.sh

      - name: Verify local browser assets and test dependencies
        run: |
          set -eu
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.3 \
            https://nodejs.org/dist/v26.13.1/node-v26.13.1-linux-x64.tar.xz \
            --output "${RUNNER_TEMP}/keybash-node.tar.xz"
          printf '%s  %s\n' 5c063e46bab0fbc1c17cc445d7ff129cbdcd0471be6ed83b6ab864f8143bc864 \
            "${RUNNER_TEMP}/keybash-node.tar.xz" | sha256sum -c -
          tar -xf "${RUNNER_TEMP}/keybash-node.tar.xz" -C "${RUNNER_TEMP}"
          node_bin="${RUNNER_TEMP}/node-v26.13.1-linux-x64/bin"
          echo "${node_bin}" >> "${GITHUB_PATH}"
          export PATH="${node_bin}:${PATH}"
          test "$(node --version)" = v26.13.1
          # pnpm is pinned by hash like Node, not by the registry's word: the
          # tarball's SHA-256 matches its published sha512 integrity. The
          # registry negotiates TLS 1.2 at most; the fixed hash, not the
          # transport, is what pins the file. pnpm 12 is a native program
          # whose wrapper package would fetch this binary unpinned, so the
          # Linux binary's own package is pinned and run without npm.
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.18.0.tgz \
            --output "${RUNNER_TEMP}/keybash-pnpm.tgz"
          printf '%s  %s\n' 679df2eedf158f639db6d1f00e713d766d0d7afc6a931bc51497a625d1e1bdf7 \
            "${RUNNER_TEMP}/keybash-pnpm.tgz" | sha256sum -c -
          mkdir "${RUNNER_TEMP}/keybash-pnpm"
          tar -xzf "${RUNNER_TEMP}/keybash-pnpm.tgz" -C "${RUNNER_TEMP}/keybash-pnpm"
          pnpm="${RUNNER_TEMP}/keybash-pnpm/package/pnpm"
          chmod 755 "${pnpm}"
          test "$("${pnpm}" --version)" = 12.18.0
          "${pnpm}" --dir web install --frozen-lockfile --ignore-scripts
          "${pnpm}" --dir web audit
          node web/vendor.mjs
          test -z "$(git status --porcelain)"
          node --test web/paste.test.mjs web/desktop-workspace.test.mjs web/remote-desktop-input.test.mjs web/remote-desktop-gfx.test.mjs
          "${pnpm}" --dir web exec playwright install --with-deps chromium

      - name: Verify the pinned toolchain and module files
        run: |
          set -eu
          expected="$(awk '$1 == "go" {print "go" $2}' go.mod)"
          test "$(go env GOVERSION)" = "${expected}"
          go mod tidy
          test -z "$(git status --porcelain)"
          go mod verify
          # The SSH module also contains unmaintained OpenPGP code. It is not
          # part of Keybash; prohibit importing it (including through tests).
          go list -deps -test ./... > "${RUNNER_TEMP}/keybash-dependencies"
          if grep -qE '^golang.org/x/crypto/openpgp($|/)' "${RUNNER_TEMP}/keybash-dependencies"; then
            echo 'unmaintained OpenPGP dependency is forbidden' >&2
            exit 1
          fi

      - name: Check formatting and invariant citations
        run: |
          set -eu
          test -z "$(gofmt -l cmd internal web)"
          grep -ohE '`(Test|Fuzz)[A-Za-z0-9_]+' docs/SECURITY-INVARIANTS.md \
            | tr -d '`' | sort -u > "${RUNNER_TEMP}/cited"
          grep -rhoE '^func (Test|Fuzz)[A-Za-z0-9_]+' --include='*_test.go' cmd internal web \
            | sed -E 's/^func //' | sort -u > "${RUNNER_TEMP}/defined"
          test -z "$(comm -23 "${RUNNER_TEMP}/cited" "${RUNNER_TEMP}/defined")"

      - name: Verify root-owned operator configuration and unprivileged CLI
        run: sh scripts/operator-config-lab.sh

      - name: Verify the isolated SSH worker process
        run: sh scripts/ssh-process-lab.sh

      - name: Build and verify the isolated native RDP laboratory
        run: sh scripts/native-rdp-lab.sh

      - name: Vet, race-test and build
        run: |
          set -eu
          go vet ./...
          go test -race -shuffle=on -count=1 -timeout=5m ./...
          # Count budgets avoid Go #75804's duration-cancellation race.
          # Every fuzz target must complete two million executions; no failure
          # is suppressed or retried. The hard timeout still detects hangs.
          go test ./internal/targetguard -run='^$' -fuzz='^FuzzCanonicalHostname$' -fuzztime=2000000x -timeout=3m
          go test ./internal/sshtransport -run='^$' -fuzz='^FuzzSSHHostKeyConfig$' -fuzztime=2000000x -timeout=3m
          go test ./internal/sshtransport -run='^$' -fuzz='^FuzzSSHWorkerFrames$' -fuzztime=2000000x -timeout=3m
          go test ./internal/terminalweb -run='^$' -fuzz='^FuzzTerminalControl$' -fuzztime=2000000x -timeout=3m
          go test ./internal/rdplab -run='^$' -fuzz='^FuzzRDPConfirmation$' -fuzztime=2000000x -timeout=3m
          go test ./internal/rdpcert -run='^$' -fuzz='^FuzzConfirmation$' -fuzztime=2000000x -timeout=3m
          go test ./internal/rdplab -run='^$' -fuzz='^FuzzRDPWireAndClipboard$' -fuzztime=2000000x -timeout=3m
          go test ./internal/rdplab -run='^$' -fuzz='^FuzzViewerDrawingSchemas$' -fuzztime=2000000x -timeout=3m
          go test ./internal/identity -run='^$' -fuzz='^FuzzIdentityJSON$' -fuzztime=2000000x -timeout=3m
          go test ./internal/identity -run='^$' -fuzz='^FuzzCustodyFields$' -fuzztime=2000000x -timeout=3m
          go test ./internal/identity -run='^$' -fuzz='^FuzzBackupFile$' -fuzztime=2000000x -timeout=3m
          go test ./internal/operatorconfig -run='^$' -fuzz='^FuzzOperatorCatalog$' -fuzztime=2000000x -timeout=3m
          go test -tags=browserlab -race -run='^TestBrowserPasswordLogin$' -timeout=90s ./internal/identity
          go test -tags=browserlab -race -run='^TestBrowserDurableCustody$' -timeout=2m ./internal/identity
          go test -tags=browserlab -race -run='^TestBrowserOwnedRemotePortable$' -timeout=2m ./internal/identity
          go test -tags=browserlab -race -run='^TestBrowserDesktopPage$' -timeout=2m ./internal/identity
          go test -tags=browserlab -race -run='^TestBrowserServerTrustWorkflow$' -timeout=2m ./internal/identity
          go test -tags=browserlab -race -run='^TestBrowserCapacityWorkflow$' -timeout=2m ./internal/identity
          go test -tags=browserlab -race -run='^TestBrowserServersPage$' -timeout=2m ./internal/identity
          go test -tags=browserlab -race -run='^TestDemoInputBoundary$|^TestDemoWorkerCancellation$|^TestInteractiveDemoBrowser$' -timeout=2m ./internal/identity
          go test -tags=browserlab -race -run='^TestBrowserTerminalLab$' -timeout=3m ./internal/sshtransport
          go test -tags=browserlab -race -run='^TestBrowserTerminalOnTheGPU$' -timeout=3m ./internal/sshtransport
          go test -tags=browserlab -race -run='^TestBrowserOwnedSSHConnectionAndLogout$' -timeout=2m ./internal/sshtransport
          # Test-only empty netns; root setup drops to UID/GID 65534 with no
          # effective capabilities before the fixed child runs. No guacd yet.
          worker_dir="$(mktemp -d /tmp/keybash-rdp-worker.XXXXXX)"
          trap 'rm -f "${worker_dir}/lab.test"; rmdir "${worker_dir}"' EXIT
          chmod 755 "${worker_dir}"
          go test -c -tags=workerlab -race -o "${worker_dir}/lab.test" ./internal/rdplab
          go vet -tags=workerlab ./internal/rdplab
          chmod 755 "${worker_dir}/lab.test"
          "${worker_dir}/lab.test" -test.run='^TestRDPEmptyWorkerNamespaceDeniesEgress$' -test.timeout=15s -test.v
          go build -trimpath ./...
          for platform in linux darwin windows; do
            GOOS="${platform}" go vet ./...
            GOOS="${platform}" go build -trimpath ./...
          done

  analysis:
    name: Static and vulnerability analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the exact event commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch -q --depth 1 origin "${GITHUB_SHA}"
          unset auth
          git checkout -q FETCH_HEAD

      - name: Install pinned analysis tools outside the repository
        run: |
          set -eu
          export GOBIN="${RUNNER_TEMP}/keybash-tools"
          mkdir -p "${GOBIN}"
          # `go install tool@version` takes its Go version from the tool's own
          # go.mod, not this one. An analyser must be built by at least the
          # Go version it reads, so build every tool with the pinned one.
          GOTOOLCHAIN="$(awk '$1 == "go" {print "go" $2}' go.mod)"
          export GOTOOLCHAIN
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Run static, security, vulnerability and workflow checks
        run: |
          set -eu
          tools="${RUNNER_TEMP}/keybash-tools"
          "${tools}/staticcheck" ./...
          "${tools}/gosec" -severity medium -confidence medium ./...
          "${tools}/govulncheck" ./...
          "${tools}/actionlint"

  ironrdp-web:
    name: IronRDP browser build
    runs-on: ubuntu-24.04
    # Two release builds plus the tools: about 25 minutes.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the exact event commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch -q --depth 1 origin "${GITHUB_SHA}"
          unset auth
          git checkout -q FETCH_HEAD

      - name: Install the pinned Rust toolchain and tools outside the repository
        run: |
          set -eu
          # The toolchain IronRDP pins, with the browser target; rustup checks
          # every component against the signed channel manifest's hashes.
          rustup toolchain install 1.94.1 --profile minimal --target wasm32-unknown-unknown
          tools="${RUNNER_TEMP}/keybash-rust-tools"
          # Both are built from crates.io sources checked against their own
          # Cargo.lock. wasm-bindgen-cli must equal the version in IronRDP's
          # Cargo.lock; the build script refuses any other.
          export RUSTUP_TOOLCHAIN=1.94.1
          cargo install --locked wasm-bindgen-cli --version 0.2.129 --root "${tools}"
          cargo install --locked cargo-audit --version 0.23.0 --root "${tools}"
          echo "${tools}/bin" >> "${GITHUB_PATH}"

      - name: Build twice in different directories and compare the bytes
        run: |
          set -eu
          python3 scripts/rust-licences-test.py
          mkdir "${RUNNER_TEMP}/a" "${RUNNER_TEMP}/b"
          sh scripts/build-ironrdp-web.sh "${RUNNER_TEMP}/a/out" --with-tests
          sh scripts/build-ironrdp-web.sh "${RUNNER_TEMP}/b/out"
          diff -r "${RUNNER_TEMP}/a/out" "${RUNNER_TEMP}/b/out"
          ls -l "${RUNNER_TEMP}/a/out"

      - name: Check that the vendored module is this build
        run: |
          set -eu
          python3 scripts/vendor-ironrdp-web-test.py
          # web/vendor/ironrdp must be byte for byte what was just built from
          # the pinned source and the patch, with a manifest of that pin.
          python3 scripts/vendor-ironrdp-web.py --check "${RUNNER_TEMP}/a/out"

      - name: Check the compiled crates for known advisories
        run: |
          set -eu
          python3 scripts/rust-advisories-test.py
          # IronRDP's lock also holds its native tools and tests. Any advisory
          # on a crate this build compiled fails, unless reviewed in the script.
          # The report itself is checked: an empty or unreadable one fails too.
          cargo audit --json --file "${RUNNER_TEMP}/a/out/Cargo.lock" > "${RUNNER_TEMP}/audit.json" || true
          python3 scripts/rust-advisories.py check --built "${RUNNER_TEMP}/a/out/BUILT.txt" "${RUNNER_TEMP}/audit.json"

  rdp-proxy:
    name: RDP proxy
    runs-on: ubuntu-24.04
    # Two release builds, the tests and the tools: about 20 minutes.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the exact event commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch -q --depth 1 origin "${GITHUB_SHA}"
          unset auth
          git checkout -q FETCH_HEAD

      - name: Install the pinned Rust toolchain and cargo-audit outside the repository
        run: |
          set -eu
          rustup toolchain install 1.94.1 --profile minimal --component clippy,rustfmt
          tools="${RUNNER_TEMP}/keybash-rust-tools"
          export RUSTUP_TOOLCHAIN=1.94.1
          cargo install --locked cargo-audit --version 0.23.0 --root "${tools}"
          echo "${tools}/bin" >> "${GITHUB_PATH}"

      - name: Test against the test peer, then build twice in different directories and compare the bytes
        run: |
          set -eu
          # The proxy's end-to-end tests meet a real NLA server: Keybash's
          # test peer, IronRDP's own server at the pinned commit, with a fresh
          # certificate and a random password.
          peer="${RUNNER_TEMP}/peer"
          sh scripts/build-rdp-testpeer.sh "${peer}"
          openssl req -x509 -newkey rsa:2048 -keyout "${peer}/key.pem" -out "${peer}/cert.pem" -days 2 -nodes \
            -subj /CN=keybash-testpeer -addext extendedKeyUsage=serverAuth 2>/dev/null
          (umask 077 && printf 'kbpeer\n%s\n' "$(openssl rand -hex 16)" > "${peer}/secret")
          "${peer}/keybash-rdp-testpeer" 127.0.0.1:3390 "${peer}/cert.pem" "${peer}/key.pem" "${peer}/secret" > "${peer}/peer.log" 2>&1 &
          for _ in $(seq 50); do bash -c '</dev/tcp/127.0.0.1/3390' 2>/dev/null && break; sleep 0.2; done
          bash -c '</dev/tcp/127.0.0.1/3390'
          mkdir "${RUNNER_TEMP}/a" "${RUNNER_TEMP}/b"
          KEYBASH_PROXY_TEST="127.0.0.1:3390,${peer}/cert.pem,@exact-leaf,${peer}/secret,peer" \
            sh scripts/build-rdp-proxy.sh "${RUNNER_TEMP}/a/out" --with-tests
          # The tests reached the peer's desktop, not only passed without it.
          grep -q '^keybash-testpeer: desktop$' "${peer}/peer.log"
          sh scripts/build-rdp-proxy.sh "${RUNNER_TEMP}/b/out"
          diff -r "${RUNNER_TEMP}/a/out" "${RUNNER_TEMP}/b/out"
          ls -l "${RUNNER_TEMP}/a/out"

      - name: Check the compiled crates for known advisories
        run: |
          set -eu
          cargo audit --json --file rdp-proxy/Cargo.lock > "${RUNNER_TEMP}/audit.json" || true
          python3 scripts/rust-advisories.py check --built "${RUNNER_TEMP}/a/out/BUILT.txt" "${RUNNER_TEMP}/audit.json"

  commit-signatures:
    name: Commit signatures
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fetch PR history without executing its code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch -q --no-tags --filter=blob:none origin "${GITHUB_SHA}"
          unset auth
          git update-ref refs/merge FETCH_HEAD
          read -r -a parents <<< "$(git rev-list --parents -n 1 refs/merge)"
          test "${#parents[@]}" -eq 3
          git update-ref refs/base "${parents[1]}"
          git update-ref refs/head "${parents[2]}"
          # The next step authenticates any lazy fetch of the base signer blob.

      - name: Verify commits against the base signer list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          signers="${RUNNER_TEMP}/keybash-commit-signers"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            show refs/base:.github/commit-signers > "${signers}"
          unset auth
          test -s "${signers}"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "${signers}"
          checked=0
          for commit in $(git rev-list refs/base..refs/head); do
            checked=$((checked + 1))
            git verify-commit "${commit}"
          done
          test "${checked}" -gt 0
